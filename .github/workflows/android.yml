name: Android release

# Сборка подписанного APK DshApp в GitHub Actions.
# Секреты: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # gradle.properties хранит Windows-пути (user.home/tmpdir) для сборки на ПК —
      # на Linux-раннере их надо нейтрализовать, иначе Gradle падает.
      - name: Neutralize Windows-only gradle paths
        run: |
          set -euo pipefail
          if [ -f gradle.properties ]; then
            sed -i 's#^org.gradle.jvmargs=.*#org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8#' gradle.properties
            sed -i 's#^kotlin.daemon.jvmargs=.*#kotlin.daemon.jvmargs=-Xmx1024m#' gradle.properties
            grep -E 'jvmargs' gradle.properties || true
          fi

      - name: Materialize signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then echo "KEYSTORE_BASE64 is not set" >&2; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          ls -l keystore.jks keystore.properties

      - name: Assemble prod
        run: gradle --no-daemon :app:assembleProd

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/prod -name '*.apk' | head -n 1)
          echo "apk: $apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-prod
          path: app/build/outputs/apk/prod/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/prod/*.apk
