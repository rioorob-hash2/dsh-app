name: Android release

# Сборка подписанного APK в GitHub Actions.
# Секреты репозитория (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    — base64 от keystore.jks (без переносов строк)
#   KEYSTORE_PASSWORD  — storePassword
#   KEY_ALIAS          — keyAlias
#   KEY_PASSWORD       — keyPassword
# Локальные keystore.jks / keystore.properties в git не попадают.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Materialize signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          ls -l keystore.jks keystore.properties

      # Robolectric в проекте ищет android-all jar в локальной папке
      # robolectric-deps (см. app/build.gradle.kts). На раннере её нет, поэтому
      # кладём нужные jar туда заранее; кэш избавляет от повторной загрузки ~350 МБ.
      # Нужны оба: API 34 (локальный @Config) и API 35 (targetSdk).
      - name: Restore Robolectric jar cache
        uses: actions/cache@v4
        with:
          path: robolectric-deps
          key: robolectric-android-all-14-10818077_15-12650502-i7

      - name: Prepare Robolectric deps
        run: |
          set -euo pipefail
          if ! grep -q robolectric app/build.gradle.kts; then
            echo "robolectric не используется — пропуск"
            exit 0
          fi
          mkdir -p robolectric-deps
          for version in 14-robolectric-10818077-i7 15-robolectric-12650502-i7; do
            jar="android-all-instrumented-$version.jar"
            if [ ! -s "robolectric-deps/$jar" ]; then
              curl -fsSL --retry 3 -o "robolectric-deps/$jar" \
                "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$version/$jar"
            fi
          done
          ls -l robolectric-deps

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble prod
        run: gradle --no-daemon :app:assembleProd

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/prod -name '*.apk' | head -n 1)
          echo "apk: $apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          "$apksigner" verify "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-prod
          path: app/build/outputs/apk/prod/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/prod/*.apk
